<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Miao — project cover</title>
    <style>
      @font-face {
        font-family: Cairo;
        src: url("assets/brand/Cairo-Bold.ttf");
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #b5e2db;
        font-family: Cairo, Arial, sans-serif;
        color: #172b29;
      }
      .cover {
        width: 1440px;
        height: 820px;
        padding: 65px 90px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        position: relative;
        overflow: hidden;
      }
      .copy {
        position: relative;
        z-index: 2;
      }
      .logo {
        width: 210px;
        height: auto;
      }
      h1 {
        font-size: 95px;
        line-height: 1.5;
        letter-spacing: -4px;
        margin: 65px 0 15px;
      }
      p {
        font-size: 19px;
        margin: 10px 0;
      }
      .english {
        font:
          12px Arial,
          sans-serif;
        letter-spacing: 3px;
        position: absolute;
        bottom: 65px;
        right: 90px;
      }
      .scene {
        position: relative;
      }
      .phone {
        width: 260px;
        position: absolute;
        border: 6px solid #172b29;
        border-radius: 35px;
        overflow: hidden;
        background: #f8faf6;
        box-shadow: 0 25px 35px #172b2928;
      }
      .phone img {
        width: 100%;
        display: block;
      }
      .front {
        left: 15px;
        top: 95px;
        transform: rotate(-10deg);
        z-index: 1;
      }
      .back {
        right: 0;
        top: 0;
        transform: rotate(10deg);
      }
      .star {
        position: absolute;
        left: 760px;
        top: 42px;
        font: 100px Arial;
        color: #172b29;
      }
      .sticker {
        position: absolute;
        left: 480px;
        bottom: 95px;
        background: #ffe9a6;
        border-radius: 50px;
        padding: 15px 30px;
        font-size: 17px;
        z-index: 3;
        transform: rotate(-9deg);
      }
      .line {
        width: 78px;
        height: 8px;
        background: #ffe9a6;
        border-radius: 6px;
        position: absolute;
        right: 90px;
        top: 405px;
        transform: rotate(-6deg);
      }
    </style>
  </head>
  <body>
    <main class="cover">
      <div class="copy">
        <img class="logo" src="assets/brand/miao.svg" alt="miao" />
        <h1>كل قط،<br />له حكاية.</h1>
        <p>مكان صغير، حكايات كثيرة.</p>
        <p>تصميم وتطوير حسين أبوزينة</p>
      </div>
      <div class="scene">
        <div class="phone back">
          <img src="assets/screens/map.jpg" alt="Miao lost-cat map" />
        </div>
        <div class="phone front">
          <img src="assets/screens/home.jpg" alt="Miao home" />
        </div>
      </div>
      <span class="star">✳</span><span class="sticker">رفقة أقرب ♥</span
      ><span class="line"></span
      ><span class="english">MIAO / ARABIC-FIRST MOBILE EXPERIENCE</span>
    </main>
  </body>
</html>
